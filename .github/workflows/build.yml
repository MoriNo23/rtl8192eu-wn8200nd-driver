name: Build rtl8192eu driver

on:
  push:
    branches: [optimization-wn8200nd]
  pull_request:
    branches: [optimization-wn8200nd]
  workflow_dispatch:  # permitir trigger manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-headers-generic build-essential bc

      - name: Verify kernel headers
        run: |
          ls -la /lib/modules/$(uname -r)/build
          echo "Kernel: $(uname -r)"

      - name: Build driver
        run: |
          make clean
          make -j$(nproc)

      - name: Show module info
        run: |
          if [ -f 8192eu.ko ]; then
            modinfo 8192eu.ko
            echo "=== PARÁMETROS COMPILADOS ==="
            modinfo -p 8192eu.ko | grep -E "rtw_enusbss|rtw_en_napi|rtw_usb_rxagg|rtw_dynamic_agg"
          else
            echo "ERROR: 8192eu.ko no se generó"
            ls -la *.ko 2>/dev/null || ls -la
            exit 1
          fi

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-module
          path: 8192eu.ko
          compression-level: 9
