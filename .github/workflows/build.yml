name: CI — build check

# Validación de compilación en GitHub Actions.
#
# NOTA: el .ko generado aquí corre contra los headers de Ubuntu del runner y NO es
# compatible (vermagic) con el Debian 6.12.x del equipo target. Esto es un
# BUILD-CHECK: confirma que el source compila limpio. La instalación real se hace
# localmente con install_manual.sh, que compila contra los headers del kernel local.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: >-
          Regenera el baseline de analisis estatico y lo sube como artefacto
          (hay que descargarlo y commitearlo). El job no falla en este modo.
        type: boolean
        default: false
      checkpatch:
        description: >-
          Anade checkpatch.pl (estilo del kernel) al job de analisis estatico.
          Opt-in desde 2026-09-29: son 7.326 de los 8.080 hallazgos del baseline,
          todos de estilo, y cuesta ~13 min y 140 MB de linux-source. En un push
          normal no corre. Ver la cabecera de ci/static-analysis.sh.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Chequeos que no necesitan compilar: rápidos, fallan pronto.
  # ---------------------------------------------------------------------------
  sanity:
    name: Sanity (Makefile + árbol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: El Makefile parsea en sus dos ramas
        run: |
          set -e
          make -n clean -C driver >/dev/null
          echo "OK: rama no-Kbuild parsea"
          make -C driver -f Makefile -n --eval='__sanity_parse:' \
            __sanity_parse KERNELRELEASE=1 src=. >/dev/null 2>&1
          echo "OK: rama Kbuild parsea"

      - name: No hay ficheros duplicados por mayúsculas/minúsculas
        # Rompen el clon en filesystems case-insensitive (macOS, Windows).
        run: |
          dups=$(find . -path ./.git -prune -o -type f -print \
                 | awk '{print tolower($0)}' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "ERROR: nombres duplicados ignorando mayúsculas:"
            echo "$dups"
            exit 1
          fi
          echo "OK: sin clones case-insensitive"

      - name: No hay restos de merge ni backups en el árbol
        run: |
          bad=$(find . -path ./.git -prune -o -type f \
                \( -name '*.orig' -o -name '*.rej' -o -name '*.mine' \
                   -o -name '*.backup' -o -name '*.bak' \) -print)
          if [ -n "$bad" ]; then
            echo "ERROR: ficheros que no deben estar versionados:"
            echo "$bad"
            exit 1
          fi
          echo "OK: árbol limpio"

      - name: "El script de recarga es seguro y no activa depuracion"
        # (a) no escribe en el procfs de debug (ya no existe con PROC_DEBUG=n),
        # (b) devuelve la interfaz a managed aunque un paso intermedio falle, que
        #     es la regla obligatoria de AGENTS.md comprobada como codigo.
        # Corre con stubs: el script real llama a rmmod/modprobe, y en la
        # maquina del runner eso no se hace nunca.
        run: ci/test-reload-script.sh

      - name: La versión está sincronizada en todos los sitios
        run: |
          set -e
          v_dkms=$(sed -n 's/^PACKAGE_VERSION="\(.*\)"/\1/p' dkms.conf)
          v_inst=$(sed -n 's/^VER="\(.*\)"/\1/p' install_manual.sh)
          echo "dkms.conf=$v_dkms  install_manual.sh=$v_inst"
          [ -n "$v_dkms" ] || { echo "ERROR: no se pudo leer PACKAGE_VERSION"; exit 1; }
          [ "$v_dkms" = "$v_inst" ] || { echo "ERROR: versiones desincronizadas"; exit 1; }
          grep -q "$v_dkms" AGENTS.md || { echo "ERROR: $v_dkms no está en el CHANGELOG de AGENTS.md"; exit 1; }
          echo "OK: versión $v_dkms sincronizada"

  # ---------------------------------------------------------------------------
  # 2. Compilación real contra headers de kernel.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.headers }})
    needs: sanity
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - headers: linux-headers-generic          # kernel base del runner
            optional: false
          - headers: linux-headers-generic-hwe-24.04 # kernel más nuevo (HWE)
            optional: true
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain + headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc kmod
          if ! sudo apt-get install -y -qq "${{ matrix.headers }}"; then
            echo "::warning::El paquete ${{ matrix.headers }} no está disponible en este runner"
            exit 1
          fi

      - name: Detectar KVER instalado
        id: kver
        run: |
          set -e
          # elegimos el árbol de headers más nuevo que tenga Makefile utilizable
          kver=""
          for d in $(ls -1 /lib/modules | sort -V -r); do
            if [ -f "/lib/modules/$d/build/Makefile" ]; then kver="$d"; break; fi
          done
          if [ -z "$kver" ]; then
            echo "ERROR: no se encontró ningún /lib/modules/*/build con Makefile"
            ls -la /lib/modules || true
            exit 1
          fi
          echo "kver=$kver" >> "$GITHUB_OUTPUT"
          echo "Compilando contra $kver"

      - name: Compilar
        run: |
          make clean
          make -j"$(nproc)" all \
            KVER="${{ steps.kver.outputs.kver }}" \
            KSRC="/lib/modules/${{ steps.kver.outputs.kver }}/build"

      - name: El módulo existe y es válido
        run: |
          test -f driver/8192eu.ko || { echo "ERROR: driver/8192eu.ko no se generó"; exit 1; }
          modinfo driver/8192eu.ko

      - name: USB ID del adaptador presente
        run: |
          if modinfo driver/8192eu.ko | grep -qi "2357p0126"; then
            echo "OK: alias USB 2357:0126 (TL-WN8200ND) compilado"
          else
            echo "ERROR: falta el alias USB 2357:0126"
            modinfo driver/8192eu.ko | grep -i alias || true
            exit 1
          fi

      - name: Parámetros y features esperados
        run: |
          echo "=== PARÁMETROS ==="
          modinfo -p driver/8192eu.ko \
            | grep -E "rtw_enusbss|rtw_en_napi|rtw_usb_rxagg|rtw_dynamic_agg|rtw_bw_mode|rtw_trx_path_bmp"
          echo "=== AP MODE (softAP/hostapd) ==="
          for sym in rtw_check_beacon_data init_mlme_ap_info rtw_macaddr_acl_init; do
            strings driver/8192eu.ko | grep -q "$sym" \
              && echo "OK: $sym" || { echo "ERROR: falta $sym"; exit 1; }
          done

      - name: Fix de URB stall recovery presente (AUDIT A1)
        # Sin el deinit, el work puede despertar sobre un adapter liberado.
        run: |
          nm -o driver/8192eu.ko | grep -q "rtw_usb_ep_reset_work_deinit" \
            && echo "OK: rtw_usb_ep_reset_work_deinit compilado" \
            || { echo "ERROR: falta el fix de use-after-free (A1)"; exit 1; }
          grep -q "rtw_usb_ep_reset_work_deinit();" driver/os_dep/linux/usb_intf.c \
            && echo "OK: se llama desde el path de disconnect" \
            || { echo "ERROR: no se llama en rtw_dev_remove()"; exit 1; }

      - name: Objetos desactivados NO se compilan (AUDIT 2.1)
        run: |
          set -e
          for o in core/rtw_vht.o core/rtw_beamforming.o core/mesh/rtw_mesh.o \
                   hal/phydm/phydm_antdiv.o hal/hal_btcoex.o; do
            if [ -f "driver/$o" ]; then
              echo "ERROR: $o se compiló y su feature está desactivada"
              exit 1
            fi
          done
          echo "OK: los objetos de features apagadas no se compilan"

      - name: Subir artefacto (solo validación — NO instalar en Debian)
        if: always() && matrix.optional == false
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-${{ steps.kver.outputs.kver }}-${{ github.sha }}
          path: driver/8192eu.ko
          if-no-files-found: warn
          retention-days: 7

      - name: Nada quedó sin limpiar tras make clean
        run: |
          make clean
          left=$(find driver -name '*.o' -o -name '*.ko' -o -name '.*.cmd' | head -20)
          if [ -n "$left" ]; then
            echo "ERROR: make clean dejó objetos atrás:"
            echo "$left"
            exit 1
          fi
          echo "OK: make clean limpia todo el árbol"

  # ---------------------------------------------------------------------------
  # 5. Analisis estatico con baseline.
  #
  # El arbol es de vendor: checkpatch sobre driver/ produce miles de avisos
  # heredados de Realtek. Un job en blanco estaria rojo desde el primer dia y
  # nadie lo miraria. El baseline convierte el job en una alerta de REGRESION:
  # falla solo ante hallazgos NUEVOS.
  #
  # El baseline se versiona y el job FALLA si falta o esta vacio. Sin esa
  # comprobacion, borrar el fichero convertiria el job en un no-op silencioso,
  # que es el fallo clasico de este patron.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis (sparse + smatch)
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Toolchain: sparse (distro) + smatch (fuente)"
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc kmod perl flex bison libz-dev \
            sqlite3 libsqlite3-dev libssl-dev \
            libdbd-sqlite3-perl libtry-tiny-perl \
            sparse linux-headers-generic
          # `linux-source` NO se instala: solo checkpatch lo necesita, y es un
          # tarball de ~140 MB. Se instala abajo solo si se pide `checkpatch`.
          # sparse: el del paquete de la distro. NO se usa el `sparsec` del arbol
          # de smatch, que es un wrapper que delega en sparse-llvm y sin LLVM
          # compilado solo imprime "llvm-config: not found" mas errores de
          # enlace. El sparse de la distro es el que usa el propio kernel.
          which sparse
          sparse --version
          # smatch si se construye desde fuente: no hay paquete en Ubuntu, y el
          # analisis de valores (smatch) es distinto del de tipos (sparse), asi
          # que van como herramientas separadas y con su propia seccion de
          # baseline (design.md D7).
          cd "$RUNNER_TEMP"
          git clone --depth 1 https://github.com/error27/smatch.git
          cd smatch
          sudo make -j"$(nproc)"
          # OJO: antes se hacia `ls -la "$SMATCH_BIN"` aqui, dentro del MISMO
          # paso que la define. GITHUB_ENV solo aplica al paso SIGUIENTE, asi que
          # en este punto la variable estaba vacia y el log decia
          # "ls: cannot access ''", sin explicar nada. Se comprueba la ruta
          # literal, que si existe, y se exporta para el paso siguiente.
          test -x "$RUNNER_TEMP/smatch/smatch" \
              || { echo "::error::smatch no se compilo en $RUNNER_TEMP/smatch/smatch"; exit 1; }
          echo "SMATCH_BIN=$RUNNER_TEMP/smatch/smatch" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/smatch/smatch"
          # checkpatch.pl del paquete linux-source. Solo se instala si el job se
          # ha pedido explicitamente con la entrada `checkpatch`, porque
          # `linux-source` es un tarball de ~140 MB que se descarga y se extrae
          # para no usarse nunca mas. Ver la cabecera de ci/static-analysis.sh
          # para por que es opt-in.
          #
          # El paquete deja el tarball en un symlink cuyo nombre lleva la
          # version, y hay que buscarlo sin asumir la extension (que cambia
          # entre distribuciones: xz en trixie, bz2 en Ubuntu 24.04).
          if [ "${{ inputs.checkpatch }}" = "true" ]; then
            sudo apt-get install -y -qq --no-install-recommends linux-source
            src=$(find /usr/src -maxdepth 1 -name 'linux-source*.tar.*' 2>/dev/null | head -1)
            if [ -z "$src" ]; then
              echo "::error::no se encontro el tarball de linux-source bajo /usr/src"
              echo "::error::contenido de /usr/src:"
              ls -la /usr/src
              exit 1
            fi
            echo "checkpatch source: $src"
            mkdir -p "$RUNNER_TEMP/lksrc"
            tar -C "$RUNNER_TEMP/lksrc" -xf "$src" --strip-components=1 \
                --wildcards '*/scripts/*'
            # Mismo caso que SMATCH_BIN: la variable no existe todavia en este
            # paso, asi que se comprueba y se lista la ruta literal.
            test -r "$RUNNER_TEMP/lksrc/scripts/checkpatch.pl" \
                || { echo "::error::checkpatch.pl no se extrajo del tarball"; \
                     ls -la "$RUNNER_TEMP/lksrc/scripts" 2>/dev/null | head; exit 1; }
            echo "CHECKPATCH=$RUNNER_TEMP/lksrc/scripts/checkpatch.pl" >> "$GITHUB_ENV"
            ls -la "$RUNNER_TEMP/lksrc/scripts/checkpatch.pl"
          else
            echo "checkpatch: opt-in no pedido, se salta (13 min y 140 MB de linux-source)"
          fi

      - name: El baseline existe y no esta vacio
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baseline) }}
        # Comprobacion explicita y visible: si el baseline desaparece, el job
        # tiene que fallar aqui, no pasar en silencio.
        run: |
          set -e
          b=ci/static-analysis-baseline.txt
          test -f "$b" || { echo "::error::no existe $b"; exit 1; }
          n=$(grep -vc '^#' "$b" || true)
          [ "$n" -gt 0 ] || { echo "::error::$b esta vacio"; exit 1; }
          echo "OK: baseline con $n entradas"
          # Debe haber entradas de las herramientas ACTIVAS. checkpatch esta
          # excluido a proposito (opt-in): si se exigiera su seccion, el job
          # fallaria aunque checkpatch no corra. La seccion se conserva en el
          # baseline para poder pedirla; lo que no se exige es que exista.
          for t in sparse smatch; do
            grep -q "^## $t" "$b" || { echo "::error::el baseline no tiene entradas de $t"; exit 1; }
            echo "OK: baseline incluye $t"
          done

      - name: "Generar el baseline (dispatch con update_baseline)"
        # El baseline tiene que generarse con el MISMO toolchain que ejecuta el
        # job. Generado en otro sitio no casa: entre el contenedor de desarrollo
        # y el runner hay diferencias de version de headers y de locale que
        # cambian como se escriben los mensajes (gcc entrecomar identificadores
        # con comillas ASCII en locale C y con comillas tipograficas en UTF-8), y
        # entonces hallazgos identicos aparecen como nuevos. Por eso se genera
        # AQUI, y luego se descarga y se commitea.
        #
        # Solo con dispatch: un push normal nunca lo regenera, porque eso dejaria
        # pasar regresiones en silencio.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline }}
        run: ci/static-analysis.sh --all --update-baseline

      - name: "Subir el baseline regenerado"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline }}
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-baseline
          path: ci/static-analysis-baseline.txt
          if-no-files-found: error
          retention-days: 30

      - name: "Generar o verificar las herramientas activas"
        # --all: una sola pasada. No es estetico, es rendimiento: cada
        # herramienta se ejecuta UNA vez en vez de repetir el build por
        # herramienta. En modo regeneracion ya se ha ejecutado arriba, asi que
        # aqui se salta.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baseline) }}
        run: ci/static-analysis.sh --all

      - name: "Verificar checkpatch (solo si se pide)"
        # Sustituye a la llamada unica anterior cuando el opt-in esta activo,
        # para que checkpatch se ejecute con su propio build.
        if: ${{ inputs.checkpatch == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.update_baseline) }}
        run: ci/static-analysis.sh checkpatch
      - name: "Resumen por herramienta"
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baseline) }}
        run: |
          for t in sparse smatch; do
            n=$(awk -v tool="$t" '/^## /{i=($2==tool);next} /^#/{next} i' \
                ci/static-analysis-baseline.txt | wc -l)
            echo "  $t: $n hallazgos en el baseline"
          done
          echo "  (checkpatch no corre en el push normal: opt-in, ver la cabecera de ci/static-analysis.sh)"

  # ---------------------------------------------------------------------------
  # 6. Aserciones de la configuracion distribuida.
  #
  # Comprueban sobre el TEXTO del arbol lo que el despliegue depende, de modo
  # que revertir una opcion falle la integracion en vez de degradar la maquina
  # en silencio. Las que dependen del .ko compilado (phydm_psd.o, rtw_proc.o,
  # simbolos) estan en los jobs build y build-debian; aqui van las que se
  # pueden comprobar sin compilar.
  # ---------------------------------------------------------------------------
  config-assertions:
    name: Aserciones de configuracion
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Los flags de silencio y de RF son los previstos
        run: |
          set -e
          expect() {
            local flag="$1" want="$2" got
            got=$(sed -n "s/^$flag *= *\(.*\)/\1/p" driver/Makefile | head -1 | sed 's/[[:space:]]*$//')
            if [ "$got" = "$want" ]; then
              echo "OK: $flag = $got"
            else
              echo "::error::$flag = '$got', se esperaba '$want'"
              exit 1
            fi
          }
          # Silencio en runtime: revertir cualquiera de estos dos reactiva el
          # logging periodico o devuelve la superficie de depuracion.
          expect CONFIG_RTW_DEBUG       n
          expect CONFIG_PROC_DEBUG      n
          # TX power: LIMIT/_EN vuelven a 'n' (1.8.1). Con 'y' el modulo NO carga:
          # kernel panic por FORTIFY en rtw_txpwr_lmt_add_with_nlen — strlen sobre
          # regd_name[0] (array de tamano cero) con ent salido de LIST_CONTAINOR.
          # No es desbordamiento real, la reserva es correcta, pero el compilador
          # calcula tamano 0 y __fortify_panic es deliberado. Ver docs/BUGS.md
          # (BUG-TXPOWER-001). NO volver a 'y' sin cerrar ese bug.
          expect CONFIG_TXPWR_LIMIT     n
          expect CONFIG_TXPWR_LIMIT_EN  n
          # El escalado por tasa si se queda: es inofensivo frente al panic
          # (no toca la tabla de limites) y ahorra PA en MCS alto.
          expect CONFIG_TXPWR_BY_RATE_EN y
          # Entrega de tramas coalescente.
          expect CONFIG_RTW_GRO         y
          # DBG se mantiene a 1 a proposito: phydm_debug.c esta dentro de
          # #if DBG y ponerlo a 0 vaciaria el objeto (design.md D1/D2).
          if grep -qE '^#define[[:space:]]+DBG[[:space:]]+0' driver/include/autoconf.h; then
            echo "::error::DBG 0 vaciaria phydm_debug.c — debe quedarse en 1"
            exit 1
          fi
          echo "OK: DBG sigue a 1"
          # CONFIG_PSD_TOOL debe seguir a y: su macro vive en
          # phydm_features_iot.h y apagarlo rompe el enlazado.
          expect CONFIG_PSD_TOOL        y

      - name: "Anti-sustitucion: el default de rtw_usb_rxagg_mode sobrevive a la HAL"
        # design.md D5. usb_halinit.c:115-116 sustituye por RX_AGG_DMA todo
        # valor que no sea RX_AGG_DMA ni RX_AGG_USB. Si el default del modulo
        # no es uno de esos valores, el driver aplica OTRO modo del que el
        # parametro dice, y eso no puede pasar sin que el CI lo note.
        run: |
          set -e
          default=$(sed -n 's/^int rtw_usb_rxagg_mode = \([0-9]*\);.*/\1/p' \
                    driver/os_dep/linux/os_intfs.c | head -1)
          if [ -z "$default" ]; then
            echo "::error::no se pudo leer el default de rtw_usb_rxagg_mode"
            exit 1
          fi
          echo "default de rtw_usb_rxagg_mode = $default"
          # RX_AGG_DMA=1 y RX_AGG_USB=2 segun el enum de hal_data.h.
          if [ "$default" != "1" ] && [ "$default" != "2" ]; then
            echo "::error::el default ($default) es un valor que usb_halinit.c:115-116"
            echo "::error::sustituye por RX_AGG_DMA. El parametro no seria honrado."
            exit 1
          fi
          echo "OK: el default es un valor que el driver honra sin sustituirlo"
          # El enum de hal_data.h tiene que seguir diciendo que RX_AGG_DMA es el
          # indice 1 y RX_AGG_DISABLE el 0, porque de eso depende la coaccion.
          # Se comprueba la DISTANCIA entre ambos, no un numero suelto: un
          # `sed` con dos sustituciones encadenadas devolvia el primer patron
          # que casaba (RX_AGG_DISABLE) y hacia fallar esta asercion sin que
          # hubiera nada mal en el codigo.
          d_off=$(grep -n 'RX_AGG_DISABLE' driver/include/hal_data.h | head -1 | cut -d: -f1)
          d_dma=$(grep -n 'RX_AGG_DMA,' driver/include/hal_data.h | head -1 | cut -d: -f1)
          d_usb=$(grep -n 'RX_AGG_USB,' driver/include/hal_data.h | head -1 | cut -d: -f1)
          if [ -z "$d_off" ] || [ -z "$d_dma" ] || [ -z "$d_usb" ]; then
            echo "::error::no se encontraron los tres miembros de RX_AGG_MODE en hal_data.h"
            exit 1
          fi
          if [ $(( d_dma - d_off )) -ne 1 ] || [ $(( d_usb - d_dma )) -ne 1 ]; then
            echo "::error::el enum RX_AGG_MODE no es consecutivo (DISABLE@$d_off, DMA@$d_dma, USB@$d_usb)"
            echo "::error::la asercion anti-sustitucion asumia los valores 0, 1 y 2"
            exit 1
          fi
          echo "OK: RX_AGG_MODE es consecutivo: DISABLE=0, DMA=1, USB=2"

      - name: "Invariantes: nada fija el dominio regulatorio"
        # La region la impone la red a la que se asocia (country IE del AP).
        # El proyecto no debe alterar el dominio regulatorio ni forzar pais.
        #
        # Solo se miran ficheros EJECUTABLES (scripts y unidades systemd), no la
        # documentacion. Antes el grep incluia '*.md' y se quejaba de si mismo:
        # AGENTS.md explica por que NO hay que forzar la region, asi que el
        # patron encontraba el texto que documenta la PROHIBICION y lo reportaba
        # como infraccion. Lo que importa es si algo lo ejecuta.
        run: |
          set -e
          hits=$(grep -rnE "^[^#]*iw[[:space:]]+reg[[:space:]]+set" \
                 --include='*.sh' --include='*.service' . 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::el repo EJECUTA una orden de 'iw reg set':"
            echo "$hits"
            exit 1
          fi
          echo "OK: ningun script ni unidad ejecuta 'iw reg set'"
          # Y al reves: la nota que explica que la region viene de la red tiene
          # que seguir existiendo. Si desaparece, la invariante queda sin
          # explicar justo cuando haria falta.
          if ! grep -rq "reg set" AGENTS.md docs/ 2>/dev/null; then
            echo "::error::no queda documentado por que NO se fija la region"
            exit 1
          fi
          echo "OK: la invariante de la region sigue documentada"
          # rtw_country_code no debe forzarse en la configuracion de modprobe.
          if grep -rn "rtw_country_code" /etc/modprobe.d/ 2>/dev/null; then
            echo "::error::rtw_country_code esta forzado en /etc/modprobe.d"
            exit 1
          fi
          echo "OK: rtw_country_code no esta forzado en modprobe.d"

      - name: "Invariantes: el reload no activa depuracion en runtime"
        # Los procedimientos de recarga no deben dejar componentes de debug
        # activos. Con PROC_DEBUG=n la escritura no tendria destino, pero el
        # intento tambien es un error: significa que alguien espera que exista.
        run: |
          set -e
          if grep -n "rtl8192eu.*odm/cmd\|dbg 13 1" scripts/reload-wn8200nd-1ant; then
            echo "::error::el script de recarga sigue escribiendo en el procfs de debug"
            exit 1
          fi
          echo "OK: el script de recarga no toca el procfs de debug"
          bash -n scripts/reload-wn8200nd-1ant
          echo "OK: bash -n pasa"

      - name: "Invariantes: no queda monitorizacionPasiva en el arbol"
        run: |
          set -e
          if [ -d monitoring ]; then
            echo "::error::el directorio monitoring/ todavia existe:"
            ls -la monitoring
            exit 1
          fi
          echo "OK: no hay directorio monitoring/"
          # Ningun script del repo debe recolectar telemetria del driver.
          #
          # Se excluyen los ficheros de CI: el propio test que VERIFICA que no
          # hay telemetría tiene que mencionar los términos que busca (menciona
          # odm/cmd justamente para comprobar que el script de recarga no lo
          # usa). Antes la asercion se quejaba de si misma, igual que la del
          # dominio regulatorio.
          hits=$(grep -rln "rx_drop_monitor\|dig_fa_monitor\|odm/cmd" \
                 --include='*.sh' . 2>/dev/null | grep -v "^./ci/" || true)
          if [ -n "$hits" ]; then
            echo "::error::scripts que recolectan telemetria del driver:"; echo "$hits"; exit 1
          fi
          echo "OK: ningun script recolecta telemetria del driver"

  # ---------------------------------------------------------------------------
  # 3. El toggle de Bluetooth debe seguir compilando (por si algún día se activa).
  # ---------------------------------------------------------------------------
  bt-toggle:
    name: Build con CONFIG_BT_COEXIST=y
    needs: sanity
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain + headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc kmod linux-headers-generic

      - name: Activar BT coex y compilar
        run: |
          set -e
          sed -i 's/^CONFIG_BT_COEXIST = n$/CONFIG_BT_COEXIST = y/' driver/Makefile
          grep -n "^CONFIG_BT_COEXIST" driver/Makefile
          kver=""
          for d in $(ls -1 /lib/modules | sort -V -r); do
            if [ -f "/lib/modules/$d/build/Makefile" ]; then kver="$d"; break; fi
          done
          make clean
          make -j"$(nproc)" all KVER="$kver" KSRC="/lib/modules/$kver/build"
          test -f driver/8192eu.ko
          strings driver/8192eu.ko | grep -q "halbtc" \
            && echo "OK: código BT coex enlazado" \
            || echo "::warning::BT compiló pero no se detectan símbolos halbtc"

  # ---------------------------------------------------------------------------
  # 4. Compilacion contra los headers REALES del despliegue (Debian 6.12).
  #
  # Los jobs `build` de arriba compilan contra los headers de Ubuntu del runner.
  # Eso prueba compatibilidad hacia delante, NO que el driver compile en la
  # maquina de despliegue (Debian trixie, kernel 6.12.x). Un vermagic o un
  # __attribute__ disponible solo en una de las dos familias pasaria el CI y
  # romperia aqui. Este contenedor es el test que corresponde.
  # ---------------------------------------------------------------------------
  build-debian:
    name: Build (Debian 6.12 headers)
    needs: sanity
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain + headers de Debian
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential bc kmod rsync ca-certificates curl gzip python3
          # El paquete de headers de Debian NO se llama linux-headers-6.12-amd64:
          # lleva la version completa (linux-headers-6.12.<n>+deb<rel>-amd64). El
          # nombre inventado hacia fallar este job. Se busca en el indice.
          base="http://deb.debian.org/debian"
          curl -sSf "$base/dists/trixie/main/binary-amd64/Packages.gz" -o /tmp/P.gz
          gzip -df /tmp/P.gz
          pkg=$(python3 ci/vm/pick-kernel.py /tmp/P headers | head -1)
          echo "paquete de headers: $pkg"
          apt-get install -y -qq --no-install-recommends "$pkg"

      - name: Detectar KVER de los headers 6.12
        id: kver
        run: |
          set -e
          kver=""
          for d in $(ls -1 /lib/modules | grep '^6\.12\.' | sort -V -r); do
            if [ -f "/lib/modules/$d/build/Makefile" ]; then kver="$d"; break; fi
          done
          if [ -z "$kver" ]; then
            echo "::error::no hay arbol de headers 6.12 en el contenedor"
            ls -la /lib/modules || true
            exit 1
          fi
          echo "kver=$kver" >> "$GITHUB_OUTPUT"
          echo "Compilando contra $kver"

      - name: Compilar
        run: |
          make clean
          make -j"$(nproc)" all \
            KVER="${{ steps.kver.outputs.kver }}" \
            KSRC="/lib/modules/${{ steps.kver.outputs.kver }}/build"

      - name: El modulo existe y es valido
        run: |
          test -f driver/8192eu.ko || { echo "::error::driver/8192eu.ko no se genero"; exit 1; }
          modinfo driver/8192eu.ko

      - name: USB ID del adaptador presente
        run: |
          modinfo driver/8192eu.ko | grep -qi "2357p0126" \
            && echo "OK: alias USB 2357:0126" \
            || { echo "::error::falta el alias USB 2357:0126"; exit 1; }

      - name: Configuracion distribuida = la esperada
        # Las mismas comprobaciones que hace `config-assertions`, pero sobre el
        # .ko compilado aqui: asi se verifica el efecto real de los flags, no
        # solo el texto del Makefile.
        run: |
          set -e
          # phydm_psd.o debe seguir compilando (dualidad de CONFIG_PSD_TOOL):
          # su macro vive en phydm_features_iot.h y apagarlo rompe el enlazado.
          test -f driver/hal/phydm/phydm_psd.o \
            || { echo "::error::phydm_psd.o NO se compilo — CONFIG_PSD_TOOL se apago por error"; exit 1; }
          echo "OK: phydm_psd.o se compila"
          # Y el enlace debe encontrarlo: si el .o existe pero el símbolo no,
          # el problema es el lado del header, no del Makefile.
          nm -o driver/8192eu.ko | grep -q "phydm_psd_init" \
            || { echo "::error::phydm_psd.o se compila pero phydm_psd_init no esta enlazado"; exit 1; }
          echo "OK: phydm_psd_init enlazado"
          # rtw_proc.o NO debe compilarse: con CONFIG_PROC_DEBUG=n el fichero
          # entero queda dentro del #ifdef y solo produciria un objeto vacio de
          # 6000 lineas de fuente.
          if [ -f driver/os_dep/linux/rtw_proc.o ]; then
            echo "::error::rtw_proc.o se compilo con CONFIG_PROC_DEBUG=n"
            exit 1
          fi
          echo "OK: rtw_proc.o fuera del build"
          # El .ko no debe llevar cadenas del arbol procfs.
          if strings driver/8192eu.ko | grep -q "rtl8192eu/"; then
            echo "::error::el .ko contiene rutas procfs con CONFIG_PROC_DEBUG=n"
            exit 1
          fi
          echo "OK: sin rutas procfs en el .ko"
          # El parametro de nivel de log no debe existir (CONFIG_RTW_DEBUG=n).
          if modinfo -p driver/8192eu.ko | grep -q "^rtw_drv_log_level"; then
            echo "::error::rtw_drv_log_level sigue expuesto con CONFIG_RTW_DEBUG=n"
            exit 1
          fi
          echo "OK: rtw_drv_log_level no es parametro del modulo"
          # Fixes de estabilidad USB presentes. `nm -o` (con -o) es lo que hace
          # el job `build`: sobre un .ko, nm sin -o no siempre reconoce el
          # formato y no imprime la tabla de simbolos.
          for s in rtw_usb_ep_reset_work_deinit rtw_usb_ep_reset_work_init; do
            nm -o driver/8192eu.ko | grep -q "$s" \
              || { echo "::error::falta el fix de URB stall: $s"; exit 1; }
          done
          echo "OK: fixes de URB stall presentes"
          # El fix de use-after-free A1 tiene que LLAMARSE, no solo existir.
          grep -q "rtw_usb_ep_reset_work_deinit();" driver/os_dep/linux/usb_intf.c \
            || { echo "::error::rtw_usb_ep_reset_work_deinit no se llama en el path de disconnect"; exit 1; }
          echo "OK: se llama desde rtw_dev_remove()"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rtl8192eu-debian-${{ steps.kver.outputs.kver }}-${{ github.sha }}
          path: driver/8192eu.ko
          if-no-files-found: warn
          retention-days: 7

      - name: Nada quedo sin limpiar
        run: |
          make clean
          left=$(find driver -name '*.o' -o -name '*.ko' -o -name '.*.cmd' | head -20)
          if [ -n "$left" ]; then
            echo "::error::make clean dejo objetos atras:"; echo "$left"; exit 1
          fi
          echo "OK: make clean limpia todo el arbol"

  # ---------------------------------------------------------------------------
  # 7. Banco de pruebas: carga y descarga REALES del modulo.
  #
  # Un contenedor NO puede hacer esto: comparte el kernel del host, asi que
  # `insmod` desde un contenedor carga el modulo en la maquina. Verificado el
  # 2026-09-28: un .ko de prueba cargado con `docker run --privileged` aparece en
  # el /proc/modules del host. Por eso este banco es una VM con kernel propio, no
  # un contenedor. Ver design.md Restriccion 5 y D9.
  #
  # Lo que comprueba y por que importa: el fix A1 de docs/AUDIT.md (el work de
  # URB stall que despierta sobre un adapter liberado) SOLO se manifiesta en la
  # descarga del modulo, no en la carga. Un job que solo comprobara que el .ko
  # compila pasaria por encima de ese fallo sin verlo.
  # ---------------------------------------------------------------------------
  vm-load-test:
    name: "VM: carga y descarga del modulo"
    needs: sanity
    # Contenedor Debian y NO ubuntu: el .ko tiene que compilarse contra el MISMO
    # kernel que luego corre dentro de la VM. Con headers de Ubuntu, el modulo
    # se compila para un kernel distinto del que carga, y el veredicto seria el
    # de un "version magic mismatch", no el del driver.
    container: debian:trixie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Toolchain: QEMU, busybox y headers del kernel del despliegue"
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential make bc kmod \
            qemu-system-x86 cpio gzip busybox-static \
            ca-certificates curl python3
          qemu-system-x86_64 --version | head -1
          base="http://deb.debian.org/debian"
          curl -sSf "$base/dists/trixie/main/binary-amd64/Packages.gz" -o /tmp/P.gz
          gzip -df /tmp/P.gz
          pkg=$(python3 ci/vm/pick-kernel.py /tmp/P headers | head -1)
          # Un $pkg vacio llegaria a `apt-get install ""` sin fallar de forma
          # util, y el error apareceria cuatro pasos mas tarde como "no hay
          # arbol de headers", que no dice nada de la causa.
          if [ -z "$pkg" ]; then
            echo "::error::pick-kernel.py no devolvio paquete de headers"
            exit 1
          fi
          echo "paquete de headers: $pkg"
          apt-get install -y -qq --no-install-recommends "$pkg"
          kver=""
          for d in $(ls -1 /lib/modules | grep '^6\.12\.' | sort -V -r); do
            if [ -f "/lib/modules/$d/build/Makefile" ]; then kver="$d"; break; fi
          done
          test -n "$kver" || { echo "::error::sin headers 6.12"; exit 1; }
          echo "KVER=$kver" >> "$GITHUB_ENV"
          echo "compilando y probando contra $kver"

      - name: "Compilar el .ko contra ese kernel"
        run: |
          set -e
          make clean
          make -j"$(nproc)" all \
            KVER="${KVER}" KSRC="/lib/modules/${KVER}/build"
          test -f driver/8192eu.ko
          modinfo driver/8192eu.ko | grep -E '^vermagic'

      - name: "Bajar el paquete del kernel para la VM"
        # El initramfs necesita el vmlinuz y los modulos, del MISMO kernel.
        run: |
          set -e
          base="http://deb.debian.org/debian"
          fn=$(python3 ci/vm/pick-kernel.py /tmp/P image | tail -1)
          [ -n "$fn" ] || { echo "::error::pick-kernel no devolvio el paquete del kernel"; exit 1; }
          echo "bajando $base/$fn"
          # A disco, NO a stdout: el kernel son ~110 MB comprimidos, y
          # redirigirlos a un pipe agota el buffer de curl y falla con
          # "(23) client returned ERROR on write" a los pocos KiB. Ese error no
          # dice nada de la causa, que aqui era el propio comando.
          curl -sSfL --retry 3 -o /tmp/kernel.deb "$base/$fn"
          ls -la /tmp/kernel.deb
          # En un contenedor, $RUNNER_TEMP no existe; se compueba que el fichero
          # ha quedado donde el paso siguiente lo va a buscar.
          test -s /tmp/kernel.deb || { echo "::error::la descarga del kernel dejo un fichero vacio"; exit 1; }
          dpkg-deb -I /tmp/kernel.deb | grep -E '^ (Package|Version)'

      - name: "Construir la imagen de la VM"
        run: |
          set -e
          # $RUNNER_TEMP no existe dentro de un contenedor de job: /tmp si, y
          # es donde se dejo el .deb en el paso anterior.
          ci/vm/build-image.sh /tmp/kernel.deb driver/8192eu.ko /tmp/initrd.img
          ls -la /tmp/initrd.img*

      - name: "Arrancar la VM y ejecutar el ciclo insmod/rmmod"
        run: |
          set -e
          OUTDIR=/tmp/vmout ci/vm/run.sh \
            /tmp/initrd.img /tmp/initrd.img.kernel 900
          # Volca el log del nucleo de la VM al log del job: sin esto, un fallo
          # de carga se pierde con la VM apagada.
          echo "=== dmesg de la VM ==="
          cat /tmp/vmout/console.log || true

      - name: "Subir el log de la VM"
        # Sin este artefacto, reproducir un fallo de carga obliga a arrancar la
        # VM de nuevo (minutos, con emulacion de software).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-load-test-${{ github.sha }}
          path: /tmp/vmout/
          if-no-files-found: warn
          retention-days: 7
