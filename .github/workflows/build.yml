name: Build rtl8192eu driver

on:
  push:
    branches: [optimization-wn8200nd]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para crear releases
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-headers-generic build-essential bc

      - name: Build driver
        run: |
          make clean
          make -j$(nproc)

      - name: Verify module
        run: |
          if [ ! -f driver/8192eu.ko ]; then
            echo "ERROR: driver/8192eu.ko no se generó"
            exit 1
          fi
          modinfo driver/8192eu.ko
          echo "=== PARÁMETROS COMPILADOS ==="
          modinfo -p driver/8192eu.ko | grep -E "rtw_enusbss|rtw_en_napi|rtw_usb_rxagg|rtw_dynamic_agg"

      - name: Package and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KERNEL=$(uname -r)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG="build-$SHA-kernel-$KERNEL"

          # Comprimir .ko con nombre descriptivo
          gzip -9 -k driver/8192eu.ko
          FILENAME="rtl8192eu-$SHA-$KERNEL.ko.gz"
          mv driver/8192eu.ko.gz "$FILENAME"

          # Notas del release
          cat > /tmp/release-notes.md <<- EOM
          Build automático del driver RTL8192EU (optimization-wn8200nd)

          - Kernel: $KERNEL
          - Commit: ${{ github.sha }}
          - Parámetros: rtw_enusbss=0 rtw_en_napi=0 rtw_usb_rxagg_mode=0 rtw_dynamic_agg_enable=0
          EOM

          # Limpiar release previo con mismo tag (en caso de rebuild)
          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin --delete refs/tags/"$TAG" 2>/dev/null || true

          # Crear release y subir archivo
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "rtl8192eu build $SHA" \
            --notes-file /tmp/release-notes.md \
            "$FILENAME"

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Build result
        run: |
          echo "✅ Build completado"
          echo "Kernel: $(uname -r)"
          echo "Release: $RELEASE_TAG"
          echo "Descargar: gh release download \"$RELEASE_TAG\" --repo ${{ github.repository }}"
